<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<script src="supabase.min.js"></script>
<script src="crm-shim.js"></script>
<title>Остатки СХ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Roboto:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* Раскладка: шапка с действиями и вкладками, плитки итогов, фильтры, матрица «товар × место хранения» с прилипающей шапкой, панель товара справа, окна операций */
:root{
  --bg:#f2f4f6; --panel:#ffffff; --ink:#17212b; --muted:#5b6a79; --line:#dbe1e7; --soft:#eaeef2;
  --accent:#1f5f9e; --accent-ink:#ffffff; --good:#12795a; --bad:#b3382c; --warn:#8a5a00; --warn-bg:#fbf1d9; --good-bg:#e1f3ec; --bad-bg:#f8e4e1;
  --font-body:Roboto,system-ui,"Segoe UI",Arial,sans-serif; --font-head:Oswald,"Arial Narrow",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --panel:#17202a; --ink:#e6ebf0; --muted:#9aa8b6; --line:#2a3642; --soft:#202b36;
  --accent:#6aa7e0; --accent-ink:#0b1722; --good:#3cc59a; --bad:#f0877b; --warn:#e0b24a; --warn-bg:#3a2f12; --good-bg:#14352b; --bad-bg:#3d1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#17202a; --ink:#e6ebf0; --muted:#9aa8b6; --line:#2a3642; --soft:#202b36;
  --accent:#6aa7e0; --accent-ink:#0b1722; --good:#3cc59a; --bad:#f0877b; --warn:#e0b24a; --warn-bg:#3a2f12; --good-bg:#14352b; --bad-bg:#3d1d19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--font-head);font-weight:600;font-size:32px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad)}
button.small{padding:3px 9px;font-size:12.5px}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs a{padding:9px 16px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:0}
.tile .l{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:var(--font-head);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.tile .n{color:var(--muted);font-size:12px}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search],input[type=number],input[type=text],input[type=datetime-local],input[type=file]{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 240px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.scroll{overflow:auto;max-height:calc(100vh - 250px);min-height:240px}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:2;background:var(--panel);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th.c,td.c{text-align:center;min-width:74px}
td.name{position:sticky;left:0;background:var(--panel);z-index:1;min-width:280px;max-width:380px}
th.name{left:0;z-index:3}
td.name .code{color:var(--muted);font-size:11.5px}
tr.grp td{background:var(--soft);font-weight:500;position:static;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
tr.item:hover td{background:var(--soft)}
tr.item:hover td.name{background:var(--soft)}
td.c{cursor:pointer}
td.c .v{display:block;font-weight:700;font-size:15px}
td.c .f{display:block;font-size:11px;white-space:nowrap}
td.c .f.ok{color:var(--good)} td.c .f.diff{color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:0 5px}
td.c.neg .v{color:var(--bad)}
td.c.zero .v{color:var(--muted);font-weight:400}
td.c.na{color:var(--line);cursor:default}
td.tot{font-weight:700;text-align:right}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;max-width:90vw}
/* панель товара и окна */
.shade{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:41;overflow:auto;padding:18px 18px 28px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.modal{position:fixed;z-index:42;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(860px,100%);padding:18px 20px 20px}
.box h3,.drawer h3{font-family:var(--font-head);font-weight:500;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f input,label.f select{color:var(--ink);font-size:14px}
.lines{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.line{display:grid;grid-template-columns:1fr 90px 32px;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.mini{width:100%;border-collapse:collapse;min-width:0}
.mini th{position:static;background:none}
.mini td,.mini th{padding:5px 6px;text-align:left}
.mini td.r,.mini th.r{text-align:right}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.hist div{border-bottom:1px solid var(--line);padding-bottom:5px}
.muted{color:var(--muted)}
.src{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.srccard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.srccard h4{margin:0;font-size:15px}
.preview{font-size:13px;color:var(--muted);margin:6px 0;min-height:18px;white-space:pre-line}
.imp{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.imp h4{margin:0 0 6px}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;background:var(--panel);cursor:pointer}
.drop.on{border-color:var(--accent);background:var(--soft)}
.drop input{display:block;margin:10px auto 0;max-width:100%}
td.r,th.r{text-align:right}
@media (max-width:640px){td.name{min-width:200px}.line{grid-template-columns:1fr 70px 32px}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Остатки СХ</h1>
      <p class="sub">Склад МойСклад, магазин, брак и точки «Арт»: расчётный и фактический остаток по каждой позиции. Продажи с сайта, по договорам и через кассу меняют расчёт сразу.</p>
    </div>
    <div class="actions">
      <button class="primary" id="b-op">+ Операция</button>
      <button id="b-inv">Инвентаризация</button>
      <button id="b-imp">Импорт</button>
      <button id="b-csv">Скачать CSV</button>
    </div>
  </header>
  <nav class="tabs" aria-label="Разделы"><a href="#ostatki" data-t="ostatki">Остатки</a><a href="#zhurnal" data-t="zhurnal">Журнал операций</a><a href="#komissionery" data-t="komissionery">Комиссионеры</a><a href="#dokumenty" data-t="dokumenty">Документы</a><a href="#zadachi" data-t="zadachi">Задачи</a><a href="#istochniki" data-t="istochniki">Источники данных</a></nav>
  <div id="view"></div>
</div>
<div id="layer"></div>
<div id="toast" hidden></div>
<datalist id="items-dl"></datalist>

<script>
(function(){
'use strict';
var LOCS=[['skl','Основной склад'],['mag','Магазин'],['brak','Брак'],['sx','Арт СХД'],['nur','Арт НУР'],['nb','Арт Ноябрьск'],['lbt','Арт ЛБТ'],['tk','Арт Тарко-Сале']];
var LN={};LOCS.forEach(function(l){LN[l[0]]=l[1]});
var TYPES={sale_site:'Продажа: сайт',sale_contract:'Продажа: договор',sale_evotor:'Продажа: касса Эвотор',sale_retail:'Продажа: розница',transfer:'Передача',return:'Возврат',receipt:'Поступление',writeoff:'Списание',adjust:'Корректировка'};
var GROUPS=[['tee','Футболки и майки'],['hood','Худи, свитшоты, олимпийки, анораки, костюмы'],['pants','Брюки и джоггеры'],['head','Головные уборы, шарфы, носки'],['bags','Рюкзаки, шопперы, пакеты, обложки'],['souv','Сувениры и канцелярия'],['kits','Конструкторы и игры'],['other','Прочее']];
var CM={},CR=[],CP=[],POS={},DEAL={};
var db=null,G={},C={},MV=[],META={sources:[]},ITEMS=[],IDX={},DEL={},NAMEID={};
var st={q:'',g:'all',mode:'all',tab:'ostatki'};
var $=function(s,r){return(r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
var money=function(n){return nf.format(Math.round(n))};
var pad=function(n){return(n<10?'0':'')+n};
var dmy=function(iso){if(!iso)return'—';var d=new Date(iso);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3500)}
function nk(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"“”„'`]/g,'').replace(/[^a-zа-я0-9]+/g,' ').trim()}
function nowIso(){return new Date().toISOString()}

/* ---------- расчёт ---------- */
function recompute(){
  ITEMS=[];IDX={};NAMEID={};
  Object.keys(G).sort(function(a,b){return(G[a].order||0)-(G[b].order||0)}).forEach(function(g){
    (G[g].items||[]).forEach(function(it){var o=Object.assign({},it,{g:g});ITEMS.push(o);IDX[o.id]=o;NAMEID[o.n]=o.id;if(o.c)NAMEID[o.c]=o.id});
  });
  DEL={};
  MV.forEach(function(m){(m.lines||[]).forEach(function(l){
    var it=IDX[l[0]];if(!it)return;
    var thr=((G[it.g]||{}).ts||{})[l[1]]||'';
    if(m.ts>thr){var k=l[0]+'|'+l[1];DEL[k]=(DEL[k]||0)+l[2]}
  })});
  var dl=$('#items-dl');if(dl){dl.innerHTML=ITEMS.map(function(i){return'<option value="'+esc(i.n)+'">'+esc(i.c||'')+'</option>'}).join('')}
}
function calc(it,loc){var b=it.L&&it.L[loc],d=DEL[it.id+'|'+loc];if(b===undefined&&d===undefined)return null;return(b||0)+(d||0)}
function fact(it,loc){var x=C[it.g]&&C[it.g].c&&C[it.g].c[it.id]&&C[it.g].c[it.id][loc];return x&&x[0]!=null?x[0]:null}
function total(it){var s=0;LOCS.forEach(function(l){var c=calc(it,l[0]);if(c!=null)s+=c});return s}
function hasDiff(it){return LOCS.some(function(l){var f=fact(it,l[0]);return f!=null&&f!==(calc(it,l[0])||0)})}
function hasNeg(it){return LOCS.some(function(l){var c=calc(it,l[0]);return c!=null&&c<0})}

/* ---------- экран «Остатки» ---------- */
function visible(){
  var q=nk(st.q);
  return ITEMS.filter(function(it){
    if(st.g!=='all'&&it.g!==st.g)return false;
    if(q&&nk(it.n+' '+(it.c||'')+' '+(it.a||'')+' '+(it.al||'')).indexOf(q)<0)return false;
    if(st.mode==='diff'&&!hasDiff(it))return false;
    if(st.mode==='neg'&&!hasNeg(it))return false;
    if(st.mode==='stock'&&total(it)<=0)return false;
    return true});
}
function cell(it,loc){
  var c=calc(it,loc),f=fact(it,loc);
  if(c===null&&f===null)return'<td class="c na">·</td>';
  var cls=c!=null&&c<0?' neg':(c===0?' zero':'');
  var h='<span class="v">'+(c==null?'—':c)+'</span>';
  if(f!=null){var d=f-(c||0);h+='<span class="f '+(d?'diff':'ok')+'">факт '+f+(d?' ('+(d>0?'+':'')+d+')':'')+'</span>'}
  return'<td class="c'+cls+'" data-i="'+esc(it.id)+'" data-l="'+loc+'">'+h+'</td>';
}
function renderStock(){
  var list=visible();
  var cells=0,diffs=0,negs=0,pcs=0,sum=0;
  ITEMS.forEach(function(it){LOCS.forEach(function(l){var c=calc(it,l[0]),f=fact(it,l[0]);if(c!=null){if(c<0)negs++;if(c>0){pcs+=c;sum+=c*(it.p||0)}}if(f!=null&&f!==(c||0))diffs++}) });
  var sk=0;ITEMS.forEach(function(it){sk+=Math.max(calc(it,'skl')||0,0)});
  var gsel='<select id="f-g" aria-label="Группа"><option value="all">Все группы</option>'+GROUPS.filter(function(g){return G[g[0]]}).map(function(g){return'<option value="'+g[0]+'"'+(st.g===g[0]?' selected':'')+'>'+esc(g[1])+'</option>'}).join('')+'</select>';
  var msel='<select id="f-m" aria-label="Показать">'+[['all','Все позиции'],['stock','Есть в наличии'],['diff','Только расхождения'],['neg','Только минусовые']].map(function(m){return'<option value="'+m[0]+'"'+(st.mode===m[0]?' selected':'')+'>'+m[1]+'</option>'}).join('')+'</select>';
  var h='<section class="tiles">'+
    tile('Позиций',nf.format(ITEMS.length),'в справочнике')+
    tile('Штук по расчёту',nf.format(pcs),'на основном складе '+nf.format(sk)+' шт.')+
    tile('По цене продажи',money(sum)+' ₽','только положительные остатки')+
    tile('Расхождения',nf.format(diffs),'факт не равен расчёту',diffs?'warn':'')+
    tile('Минус по расчёту',nf.format(negs),'продано больше, чем приходовано',negs?'bad':'')+
    '</section>'+
    '<div class="filters"><input type="search" id="f-q" placeholder="Поиск по названию, коду, артикулу" aria-label="Поиск" value="'+esc(st.q)+'">'+gsel+msel+'<span class="muted" id="f-n"></span></div>';
  if(!ITEMS.length){return h+'<div class="panel"><div class="empty">В базе пока нет остатков. Нажмите «Импорт» и загрузите выгрузку МойСклад или лист с остатками.</div></div>'}
  h+='<div class="panel"><div class="scroll"><table><thead><tr><th class="name">Наименование</th>'+LOCS.map(function(l){return'<th class="c">'+l[1]+'</th>'}).join('')+'<th class="r">Итого расч.</th></tr></thead><tbody>';
  var cur='';
  list.forEach(function(it){
    if(it.g!==cur){cur=it.g;var gn=(G[cur]||{}).name||cur;h+='<tr class="grp"><td class="name" colspan="'+(LOCS.length+2)+'">'+esc(gn)+'</td></tr>'}
    h+='<tr class="item"><td class="name"><div>'+esc(it.n)+'</div><div class="code">'+esc(it.c||'')+(it.ms?'':' · нет в МС')+'</div></td>'+LOCS.map(function(l){return cell(it,l[0])}).join('')+'<td class="tot">'+total(it)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}
function tile(l,v,n,cls){return'<div class="tile '+(cls||'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="n">'+n+'</div></div>'}

/* ---------- журнал ---------- */
function renderJournal(){
  if(!MV.length)return'<div class="panel"><div class="empty">Операций пока нет. Продажи с сайта, по договорам и через кассу появятся здесь.</div></div>';
  var h='<div class="panel"><div class="scroll"><table><thead><tr><th>Дата</th><th>Тип</th><th>Документ</th><th>Позиции</th><th>МойСклад</th><th></th></tr></thead><tbody>';
  MV.slice(0,400).forEach(function(m){
    var inBase=(m.lines||[]).every(function(l){var it=IDX[l[0]];return it&&m.ts<=((G[it.g]||{}).ts||{})[l[1]]});
    var lines=(m.lines||[]).slice(0,6).map(function(l){var it=IDX[l[0]];return esc(it?it.n:l[0])+' · '+LN[l[1]]+' · <b>'+(l[2]>0?'+':'')+l[2]+'</b>'}).join('<br>');
    if((m.lines||[]).length>6)lines+='<br><span class="muted">и ещё '+(m.lines.length-6)+'</span>';
    h+='<tr><td style="white-space:nowrap">'+dmy(m.ts)+'</td><td>'+esc(TYPES[m.type]||m.type)+(inBase?' <span class="tag">уже учтено в базе</span>':'')+'</td><td>'+esc(m.ref||'')+(m.note?'<div class="muted">'+esc(m.note)+'</div>':'')+'</td><td>'+lines+'</td><td style="white-space:nowrap">'+msqCell(m)+'</td><td><button class="small danger" data-del="'+esc(m.id)+'">Удалить</button></td></tr>';
  });
  return h+'</tbody></table></div></div>';
}

/* ---------- источники ---------- */
function renderSources(){
  var ts={};Object.keys(G).forEach(function(g){Object.keys(G[g].ts||{}).forEach(function(l){if(!ts[l]||G[g].ts[l]>ts[l])ts[l]=G[g].ts[l]})});
  var bySrc={};MV.forEach(function(m){var s=m.src||'ручной ввод';bySrc[s]=(bySrc[s]||0)+1});
  var factN=0;Object.keys(C).forEach(function(g){Object.keys((C[g]||{}).c||{}).forEach(function(i){factN+=Object.keys(C[g].c[i]).length})});
  var S=(META&&META.src)||{};
  var ms=S.ms||{},ev=S.evotor||{},site=S.site||{};
  var cards=[

/* ---------- импорт ---------- */
function readSheet(file){
  return new Promise(function(res,rej){
    if(typeof XLSX==='undefined'){rej(new Error('Библиотека чтения Excel не загрузилась'));return}
    var fr=new FileReader();fr.onerror=function(){rej(new Error('Файл не прочитан'))};
    fr.onload=function(){try{var wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];res(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}))}catch(e){rej(e)}};
    fr.readAsArrayBuffer(file);
  });
}

function findItem(name,code,art){
  var byCode=null,byName=null;
  var kn=nk(name);
  for(var i=0;i<ITEMS.length;i++){var it=ITEMS[i];
    if(code&&it.c&&String(it.c)===String(code))return it;
    if(!byName&&(nk(it.n)===kn||(it.al&&nk(it.al)===kn)))byName=it;
  }
  return byName;
}

/* ---------- комиссионеры ---------- */
function commCalc(c){
  var R=CR.filter(function(r){return r.comm===c.id}),P=CP.filter(function(p){return p.comm===c.id});
  var sold=0,fee=0,A=0,B=0,pin=0,pout=0,est=0;
  R.forEach(function(r){sold+=r.sold||0;fee+=r.fee||0;if(r.est)est++;
    if(c.kind==='in')B+=(r.sold||0)-(r.fee||0);
    else if(r.recv==='they')A+=(r.sold||0)-(r.fee||0);
    else B+=r.fee||0});
  P.forEach(function(p){if(p.dir==='in')pin+=p.sum||0;else pout+=p.sum||0});
  return{R:R,P:P,sold:sold,fee:fee,pin:pin,pout:pout,est:est,A:A,B:B,bal:(A-pin)-(B-pout),has:R.length>0};
}

  var c=CM[id];if(!c)return;closeLayer();
  var k=commCalc(c);
  var rr=k.R.slice().sort(function(a,b){return a.ts<b.ts?-1:1}).map(function(r){return'<tr><td>'+esc(r.period)+'</td><td class="r">'+(r.qty||0)+'</td><td class="r">'+money(r.sold)+'</td><td class="r">'+money(r.fee)+(r.est?' <span class="tag warn" title="В листе не заполнено, оценка по среднему проценту">оц.</span>':'')+'</td><td class="r">'+(r.recv==='they'?'у него':'у нас')+'</td><td><button class="small danger" data-delc="crep:'+esc(r.id)+'">×</button></td></tr>'}).join('')||'<tr><td colspan="6" class="muted">Отчётов нет. Добавьте отчёт ниже или пришлите мне файлы.</td></tr>';

async function toJpeg(blob,max){
  max=max||1600;var bmp=await createImageBitmap(blob);var k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  var cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise(function(ok,no){cv.toBlob(function(b){b?ok(b):no(new Error('нет изображения'))},'image/jpeg',0.82)});
}
async function extract(file){
  var n=file.name.toLowerCase(),out={text:'',images:[]};
  if(/\.(txt|csv|md)$/.test(n)){out.text=await file.text();return out}
  if(/\.docx$/.test(n)){var z=await JSZip.loadAsync(await file.arrayBuffer());var x=await z.file('word/document.xml').async('string');out.text=x.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');return out}
  if(/\.(xlsx|xls)$/.test(n)){var wb=XLSX.read(await file.arrayBuffer(),{type:'array'});wb.SheetNames.slice(0,3).forEach(function(s){out.text+='## '+s+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[s]).split('\n').slice(0,80).join('\n')+'\n'});return out}
  if(/\.pdf$/.test(n)||file.type==='application/pdf'){
    var P=window.pdfjsLib;if(!P)throw new Error('нет модуля чтения PDF');
    P.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var pdf=await P.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    for(var i=1;i<=Math.min(pdf.numPages,4);i++){var pg=await pdf.getPage(i);var tc=await pg.getTextContent();out.text+=tc.items.map(function(it){return it.str}).join(' ')+'\n'}
    if(out.text.replace(/\s/g,'').length<120){out.text='';
      for(var j=1;j<=Math.min(pdf.numPages,2);j++){var p2=await pdf.getPage(j);var vp=p2.getViewport({scale:1.6});var cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await p2.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        out.images.push(await new Promise(function(ok){cv.toBlob(ok,'image/jpeg',0.8)}))}}
    return out;
  }
  if(/\.(jpe?g|png|webp|gif)$/.test(n)||/^image\//.test(file.type)){out.images.push(await toJpeg(file));return out}
  throw new Error('формат не поддерживается');
}
function classifyPrompt(name,text){

  'Типы (поле type): contract — договор, допсоглашение, спецификация; invoice_in — счёт на оплату, выставленный НАМ поставщиком; invoice_out — счёт, выставленный НАМИ покупателю; upd — УПД, накладная, акт; comm_report — отчёт комиссионера или агента о продажах; order — заказ, КП, коммерческое предложение; bank — выписка, платёжное поручение; letter — письмо, претензия, запрос; other — всё остальное.\n'+

  'Имя файла: '+name+'\nТекст документа:\n'+String(text||'(текста нет, смотри изображения)').slice(0,7000);

async function classify(file,ex){
  var opt={modelTier:'default',cache:false};
  if(ex.images.length){var lm=await SMP.limits();if(!lm||!lm.images)throw new Error('изображения не разрешены');opt.images=ex.images}
  var r=await SMP.json(classifyPrompt(file.name,ex.text),opt);
  if(!r||typeof r!=='object')throw new Error('пустой ответ');
  if(!DT[r.type])r.type='other';
  ['amount','qty','sold','fee'].forEach(function(k){r[k]=(r[k]===null||r[k]===''||isNaN(+r[k]))?null:+r[k]});
  r.confidence=Math.max(0,Math.min(1,+r.confidence||0));return r;
}

  return'<h3 style="font-size:16px;margin-top:16px">Договор и факт</h3><dl class="kv">'+rows.map(function(r){return'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'}).join('')+'</dl>'+(f.kits?'<p class="muted"><b>Конструкторы:</b> передано '+f.kits.q+' шт. на '+money(f.kits.r)+' ₽, продано '+f.kits.soldQ+' шт. на '+money(f.kits.soldR)+' ₽, остаток '+f.kits.leftQ+' шт. на '+money(f.kits.leftR)+' ₽. '+esc(f.kits.note||'')+'</p>':'')+(f.note?'<p class="muted">'+esc(f.note)+'</p>':'')+(f.note2?'<p class="muted">'+esc(f.note2)+'</p>':'');
}
/* ---------- подключение к базе ---------- */
function snap(q,fn){q.onSnapshot(function(s){fn(s);recompute();render()},function(e){toast('Нет доступа к данным: '+(e&&e.message||e))})}
render();
window.claude.use('assets').then(function(a){AS=a||null;if(st.tab==='dokumenty')render()},function(){});
window.claude.use('sample').then(function(s){SMP=s||null;if(st.tab==='dokumenty')render()},function(){});
window.claude.use('db').then(function(d){
  db=d;
  if(!db){$('#view').innerHTML='<div class="panel"><div class="empty">Данные доступны после входа.</div></div>';return}
  snap(db.collection('base'),function(s){G={};s.docs.forEach(function(x){G[x.id]=x.data()})});
  snap(db.collection('cnt'),function(s){C={};s.docs.forEach(function(x){C[x.id]=x.data()})});
  snap(db.collection('moves').orderBy('ts','desc').limit(1000),function(s){MV=s.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o})});
  snap(db.collection('comm'),function(x){CM={};x.docs.forEach(function(d){var o=Object.assign({},d.data());o.id=d.id;CM[d.id]=o})});
  snap(db.collection('crep').limit(1000),function(x){CR=x.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o})});
  snap(db.collection('docs').limit(500),function(x){DOCS=x.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o})});
  snap(db.collection('tasks').limit(500),function(x){TASKS=x.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o})});
  snap(db.collection('msq'),function(x){MSQ={};x.docs.forEach(function(d){MSQ[d.id]=d.data()})});
  snap(db.collection('rfin'),function(x){RFN={};x.docs.forEach(function(d){RFN[d.id]=d.data()})});
  snap(db.collection('rmax'),function(x){RMX={};x.docs.forEach(function(d){RMX[d.id]=d.data()})});
  snap(db.collection('cpos'),function(x){POS={};x.docs.forEach(function(d){POS[d.id]=d.data()})});
  snap(db.collection('cdeal'),function(x){DEAL={};x.docs.forEach(function(d){DEAL[d.id]=d.data()})});
  snap(db.collection('cpay').limit(1000),function(x){CP=x.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o})});
  db.doc('ref/meta').onSnapshot(function(s){META=(s.exists&&s.data())||META},function(){});
  route();
});
route();
})();
</script>
